[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]

[terminal.shell]
program = "/usr/bin/fish"

[font]
size = 10.0

[font.normal]
family = "JetBrainsMono NF"
style = "Regular"

[font.bold]
family = "JetBrainsMono NF"
style = "Bold"

[font.italic]
family = "JetBrainsMono NF"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono NF"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[window.padding]
x = 8
y = 8

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Beam"
