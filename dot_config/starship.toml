"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
[╭](fg:subtext0)\
$os\
$directory\
$git_branch\
$fill\
$nodejs\
$dotnet\
$python\
$java\
$c\
$cmd_duration\
$shell\
$time\
$username\
$line_break\
$character\
"""

add_newline = true

[os]
format = '(fg:subtext0)[](fg:red)[$symbol](fg:base bg:red)[](fg:red)'
disabled = false

[os.symbols]
Alpaquita = ""
Alpine = ""
AlmaLinux = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = ""
Artix = ""
CachyOS = ""
CentOS = ""
Debian = ""
DragonFly = ""
Elementary = ""
Emscripten = ""
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = "󰛓"
Gentoo = ""
HardenedBSD = "󰞌"
Illumos = "󰈸"
Ios = "󰀷"
Kali = ""
Linux = ""
Mabox = ""
Macos = ""
Manjaro = ""
Mariner = ""
MidnightBSD = ""
Mint = ""
NetBSD = ""
NixOS = ""
Nobara = ""
OpenBSD = "󰈺"
openSUSE = ""
OracleLinux = "󰌷"
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
RockyLinux = ""
Redox = "󰀘"
Solus = "󰠳"
SUSE = ""
Ubuntu = ""
Unknown = ""
Void = ""
Windows = "󰍲"
Zorin = ""

[directory]
format = '[─](fg:subtext0)[](fg:pink)[󰷏](fg:base bg:pink)[](fg:pink bg:surface1)[ ${read_only}](fg:red bg:surface1)[$truncation_symbol$path](fg:subtext1 bg:surface1)[](fg:surface1)'
home_symbol = " ~/"
truncation_symbol = ' '
truncation_length = 2
read_only = '󱧵 '
read_only_style = 'fg:red bg:surface1'

[git_branch]
format = '[─](fg:subtext0)[](fg:green)[$symbol](fg:base bg:green)[](fg:green bg:surface1)[ $branch](fg:subtext1 bg:surface1)[](fg:surface1)'
symbol = ''

[nodejs]
format = '[─](fg:subtext0)[](fg:green)[$symbol](fg:base bg:green)[](fg:green bg:surface1)[ $version](fg:subtext1 bg:surface1)[](fg:surface1)'
symbol = '󰎙 Node.js'

[dotnet]
format = '[─](fg:subtext0)[](fg:sapphire)[$symbol](fg:base bg:sapphire)[](fg:sapphire bg:surface1)[ $tfm](fg:subtext1 bg:surface1)[](fg:surface1)'
symbol = ' .NET'

[python]
format = '[─](fg:subtext0)[](fg:green)[$symbol](fg:base bg:green)[](fg:green bg:surface1)[ $version](fg:subtext1 bg:surface1)[](fg:surface1)'
symbol = ' python'

[java]
format = '[─](fg:subtext0)[](fg:red)[$symbol](fg:base bg:red)[](fg:red bg:surface1)[ $version](fg:subtext1 bg:surface1)[](fg:surface1)'
symbol = ' Java'

[c]
format = '[─](fg:subtext0)[](fg:blue)[$symbol](fg:base bg:blue)[](fg:blue bg:surface1)[ $version](fg:subtext1 bg:surface1)[](fg:surface1)'
symbol = ' C'

[fill]
symbol = '─'
style = 'fg:subtext0'

[cmd_duration]
min_time = 500
format = '[─](fg:subtext0)[](fg:flamingo)[](fg:base bg:flamingo)[](fg:flamingo bg:surface1)[ $duration ](fg:subtext1 bg:surface1)[](fg:surface1)'

[shell]
format = '[─](fg:subtext0)[](fg:blue)[](fg:base bg:blue)[](fg:blue bg:surface1)[ $indicator](fg:subtext1 bg:surface1)[](fg:surface1)'
unknown_indicator = 'shell'
powershell_indicator = 'powershell'
fish_indicator = 'fish'
disabled = false

[time]
format = '[─](fg:subtext0)[](fg:sapphire)[󰦖](fg:base bg:sapphire)[](fg:sapphire bg:surface1)[ $time](fg:subtext1 bg:surface1)[](fg:surface1)'
time_format = '%H:%M'
disabled = false

[username]
format = '[─](fg:subtext0)[](fg:yellow)[](fg:base bg:yellow)[](fg:yellow bg:surface1)[ $user](fg:subtext1 bg:surface1)[](fg:surface1) '
show_always = true

[character]
format = """
[╰─$symbol](fg:subtext0) """
success_symbol = ' [ ](fg:bold green)'
error_symbol = '[ × ](fg:bold red)'

