"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = false

format = """
[█](surface0)$os$username[]\
(bg:blue fg:surface0)$directory[]\
(fg:blue bg:green)$git_branch$git_status[](fg:green) \
"""

right_format = """
[](fg:surface0)$status\
[](bg:surface0 fg:text)$kubernetes\
[](bg:surface0 fg:text)$time\
"""

