[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:text"
format = '[ $user ]($style)'

[directory]
read_only = "󰌾 "
style = "fg:mantle bg:blue"
format = "[ $path ]($style)"
truncation_length = 10
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = ""
style = "bg:teal"
format = '[[ $symbol $branch ](fg:base bg:green)]($style)'

[git_status]
style = "bg:teal"
format = '[[($all_status$ahead_behind )](fg:base bg:green)]($style)'

[package]
symbol = "󰏗 "

[perl]
symbol = " "

[php]
symbol = " "

[pijul_channel]
symbol = " "

[pixi]
symbol = "󰏗 "

[python]
symbol = " "

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
symbol = "󱘗 "

[scala]
symbol = " "

# [status]
# symbol = " "

[status]
disabled = false
style = 'bg:surface0'
failure_style = 'bg:surface0 fg:red'
success_style = 'bg:surface0 fg:green'
success_symbol = " "
symbol = " "
not_executable_symbol = " "
not_found_symbol = " "
sigint_symbol = " "
signal_symbol = " "
format = '[ $symbol $status ]($style)'

[swift]
symbol = " "

[xmake]
symbol = " "

[zig]
symbol = " "

[kubernetes]
disabled = false
style = "bg:surface0 fg:text"
format = '[ $symbol$context( \($namespace\) )]($style)'

[time]
disabled = false
time_format = "%T"
style = "bg:blue"
format = '[[ $time  ](fg:text bg:surface0)]($style)'

